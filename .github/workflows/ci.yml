name: CI

on:
  push:
    branches: [develop, main, "feature/**"]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: cryptography bcrypt
          pip install ".[dev]"

      - name: Run unit tests
        run: pytest
        env:
          # conftest sets these; keep defaults explicit for clarity
          MDBAAS_ENABLE_SCHEDULER: "false"
          MDBAAS_ENABLE_BOOTSTRAP: "false"

      - name: Alembic upgrade (SQLite smoke)
        run: |
          export MDBAAS_DATABASE_URL="sqlite:////tmp/mdbaas-alembic-ci.db"
          export MDBAAS_CREDENTIAL_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          alembic upgrade head
          alembic current
