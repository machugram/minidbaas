[project]
name = "minidbaas"
version = "0.1.0"
description = "Self-service platform that provisions and manages Postgres instances on demand"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.1",     # metadata DB driver (Postgres)
    "docker>=7.1",              # data-plane provisioner
    "apscheduler>=3.10",        # in-process lifecycle scheduler (ADR-006)
    "cryptography>=42.0",       # Fernet credential encryption (ADR-005)
    "bcrypt>=4.1",              # API-key hashing (DR-5)
    "typer>=0.12",              # demo CLI
    "httpx>=0.27",              # CLI transport + test client
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[project.scripts]
mdbaas = "cli.mdbaas:app"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.api", "app.services", "app.lifecycle", "app.provisioner", "cli"]
